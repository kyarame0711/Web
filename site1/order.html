<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>注文案内｜田端果樹園</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<div class="site">

    <!-- ヘッダー -->
    <header class="header">

        <div class="logo">
            <img src="images/logo.png" alt="田端果樹園">

            <div class="logo-text">
                <h1>田端果樹園</h1>
                <p>tabata kajuen</p>
            </div>
        </div>

        <nav class="navigation">
            <a href="index.html">紹介</a>
            <a href="producer.html">生産者紹介・歴史</a>
            <a href="fruit.html">果実・商品紹介</a>
            <a href="access.html">営業案内・アクセス</a>
            <a href="order.html">注文案内</a>
        </nav>

    </header>


    <!-- 注文案内 -->
    <main class="order-page">

        <h2 class="page-title">注文案内</h2>


        <!-- 注文方法 -->
        <section class="order-method">

            <!-- 店舗での注文 -->
            <div class="order-box">

                <h3>店舗でのご注文</h3>

                <p>
                    果樹園でご注文いただけます。
                </p>

                <p>
                    スタッフが丁寧にご案内します。
                </p>

            </div>


            <!-- オンラインショップ -->
            <div class="order-box">

                <h3>オンラインショップ</h3>

                <p>
                    ご自宅にいながら、簡単にご注文いただけます。
                </p>

                <p>
                    全国へお届けします。
                </p>

            </div>

        </section>


        <!-- お支払い方法 -->
        <section class="payment">

            <h3>お支払い方法</h3>

            <div class="payment-list">

                <!-- クレジットカード -->
                <div class="payment-box">

                    <h4>クレジットカード</h4>

                    <p>
                        各種クレジットカードが<br>
                        ご利用できます。
                    </p>

                </div>


                <!-- 代金引換 -->
                <div class="payment-box">

                    <h4>代金引換</h4>

                    <p>
                        商品お届け時に<br>
                        お支払いください。
                    </p>

                </div>


                <!-- 銀行振込 -->
                <div class="payment-box">

                    <h4>銀行振込</h4>

                    <p>
                        ご入金確認後の<br>
                        発送となります。
                    </p>

                </div>

            </div>

        </section>

    </main>

</div>

</body>

</html>
