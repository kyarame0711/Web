<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>田端果樹園</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">

        <!-- ロゴ -->
        <div class="logo">
            <img src="images/logo.png" alt="田端果樹園のロゴ">
            <div class="logo-text">
                <h1>田端果樹園</h1>
                <p>tabata kajuen</p>
            </div>
        </div>

        <!-- メニュー -->
        <nav class="navigation">
            <a href="index.html">紹介</a>
            <a href="producer.html">生産者紹介・歴史</a>
            <a href="fruit.html">果実・商品紹介</a>
            <a href="access.html">営業案内・アクセス</a>
            <a href="order.html">注文案内</a>
        </nav>

    </header>


    <!-- メインビジュアル -->
    <main>

        <section class="main-visual">

            <img src="images/Image_yama.jpg.jpeg" alt="田端果樹園の風景">

            <div class="main-text">
                <h2>
                    長崎の自然が育む、<br>
                    甘くておいしい果実。
                </h2>

                <p>
                    長崎の豊かな自然の中で、<br>
                    ひとつひとつ丁寧に育てた果実を<br>
                    お届けします。
                </p>
            </div>

        </section>


        <!-- 3つの紹介 -->
        <section class="features">

            <div class="feature-box">
                <h3>自然の恵</h3>

                <p>
                    長崎の温暖な気候と潮風が、<br>
                    甘くてみずみずしい果実を<br>
                    育てます。
                </p>
            </div>


            <div class="feature-box">
                <h3>まごころを込めて</h3>

                <p>
                    ひとつひとつ丁寧に、<br>
                    愛情を込めて育てています。
                </p>
            </div>


            <div class="feature-box">
                <h3>新鮮をお届け</h3>

                <p>
                    旬の果実を、鮮度そのまま<br>
                    お届けします。
                </p>
            </div>

        </section>

    </main>

</body>

</html>
