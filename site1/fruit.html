<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>果実紹介｜田端果樹園</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<div class="site">

    <!-- ヘッダー -->
    <header class="header">

        <div class="logo">
            <img src="images/logo.png" alt="田端果樹園">

            <div class="logo-text">
                <h1>田端果樹園</h1>
                <p>tabata kajuen</p>
            </div>
        </div>

        <nav class="navigation">
            <a href="index.html">紹介</a>
            <a href="producer.html">生産者紹介・歴史</a>
            <a href="fruit.html">果実・商品紹介</a>
            <a href="access.html">営業案内・アクセス</a>
            <a href="order.html">注文案内</a>
        </nav>

    </header>


    <!-- 果実紹介 -->
    <main class="fruit-page">

        <h2 class="page-title">果実紹介</h2>


        <!-- 果物3つ -->
        <section class="fruit-list">

            <!-- ポンカン -->
            <div class="fruit-box">

                <img src="images/ponkan.jpg" alt="ポンカン">

                <h3>ポンカン</h3>

                <p>
                    旬：2月～3月
                </p>

                <p>
                    品種：ポンカン（太田）
                </p>

            </div>


            <!-- みかん -->
            <div class="fruit-box">

                <img src="images/mikan.jpg" alt="みかん">

                <h3>みかん</h3>

                <p>
                    旬：11月
                </p>

                <p>
                    品種：上野早生<br>
                    岩崎
                </p>

            </div>


            <!-- 枇杷 -->
            <div class="fruit-box">

                <img src="images/biwa.jpg" alt="枇杷">

                <h3>枇杷</h3>

                <p>
                    旬：5月末
                </p>

                <p>
                    品種：なつたより<br>
                    茂木びわ
                </p>

            </div>

        </section>

         <h2>収穫カレンダー（目安）</h2>

          <!-- 商品紹介 -->
    <main class="product-page">

        <h2 class="page-title">商品紹介</h2>


        <!-- 商品一覧 -->
        <section class="product-list">

            <!-- ポンカン -->
            <div class="product-box">

                <img src="images/ponkan-product.jpg" alt="ポンカン">

                <h3>ポンカン</h3>

                <p>￥2400</p>

            </div>


            <!-- ポンカンジュース -->
            <div class="product-box">

                <img src="images/ponkan-juice.jpg" alt="ポンカンジュース">

                <h3>ポンカンジュース</h3>

            </div>


            <!-- 枇杷 -->
            <div class="product-box">

                <img src="images/biwa-product.jpg" alt="枇杷">

                <h3>枇杷<br>特秀品</h3>

                <p>￥3,500</p>

                <p>美味</p>

                <p>￥5,000</p>

            </div>


            <!-- みかん -->
            <div class="product-box">

                <img src="images/mikan-product.jpg" alt="みかん">

                <h3>みかん</h3>

            </div>

        </section>


        <!-- 保存方法・おすすめポイント -->
        <section class="product-info">

            <!-- 保存方法 -->
            <div class="info-box">

                <h3>保存方法</h3>

                <p>
                    風通しの良い涼しい場所、<br>
                    または冷蔵庫で保存し、<br>
                    お早めにお召し上がりください。
                </p>

            </div>


            <!-- おすすめポイント -->
            <div class="info-box">

                <h3>おすすめポイント</h3>

                <p>
                    もぎたて新鮮
                </p>

                <p>
                    季節限定の味覚をお届け
                </p>

            </div>
        </section>

</div>

</body>
</html>
